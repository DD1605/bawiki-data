name: Pre Deploy

on:
  push:
    branches: ['main']
  schedule:
    # 04:17 Asia/Shanghai. Avoid minute 0 because GitHub may delay or drop
    # scheduled workflows during top-of-hour load spikes.
    - cron: '17 20 * * *'
  workflow_dispatch:
    inputs:
      update_gacha:
        description: 'Regenerate data/gacha.json'
        required: false
        default: false
        type: boolean

permissions: write-all

jobs:
  pre-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      # Environment
      - name: Setup PDM
        uses: pdm-project/setup-pdm@v3
        with:
          python-version: '3.10'
      - name: Set Up Node.js 16
        uses: actions/setup-node@v3
        with:
          node-version: 16
      - name: Install Prettier
        run: npm i -g prettier

      # Pre deploy
      - name: Install Dependencies
        run: pdm install -G:all
      - name: Run pre-deploy.sh
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.update_gacha }}" = "true" ]; then
            BAWIKI_UPDATE_GACHA=1 pdm run sh scripts/pre-deploy.sh
          else
            pdm run sh scripts/pre-deploy.sh
          fi
      - name: Format with Prettier
        run: prettier -c -w .
      - name: Commit changes
        run: |
          git config user.name github-actions[bot]
          git config user.email github-actions[bot]@users.noreply.github.com
          git add .
          git commit -m "pre deploy" || exit 0
          git push
